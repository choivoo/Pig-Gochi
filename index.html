<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>지우개 RPG - 책상 위의 전쟁</title>
<meta name="description" content="학교 책상 위에서 지우개를 튕겨 싸우는 추억의 '지우개 따먹기' RPG. 설치 없이 모바일·PC에서 바로 플레이!">
<meta name="theme-color" content="#d9a86c">
<meta property="og:title" content="지우개 RPG - 책상 위의 전쟁">
<meta property="og:description" content="튕기고, 따먹고, 성장하라! 설치 없는 추억의 지우개 따먹기 RPG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="지우개 RPG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="main-ui">
    <header id="topbar" hidden></header>
    <main id="screen"></main>
    <nav id="nav" hidden>
      <button class="tab" data-go="home"><i>🏠</i>홈</button>
      <button class="tab" data-go="adventure"><i>🗺️</i>모험</button>
      <button class="tab" data-go="erasers"><i>🩷</i>지우개</button>
      <button class="tab" data-go="bag"><i>🎒</i>가방</button>
      <button class="tab" data-go="shop"><i>🏪</i>문방구</button>
      <button class="tab" data-go="dex"><i>📖</i>도감</button>
    </nav>
  </div>
  <div id="battle" hidden>
    <div class="bwrap"><canvas id="cv"></canvas></div>
    <div id="hud"></div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
</div>
<noscript><p style="padding:2em">이 게임은 JavaScript가 필요해요.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
